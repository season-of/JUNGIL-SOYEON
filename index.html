<style>
  :root {
    --burgundy: #1a1a1a;
    --burgundy-light: #333333;
    --cream: #fffef8;
    --ink: #1a1a1a;
    --line: #e0ddd0;
    --pink-bg: #f5f4ec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #fffef8;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  .invite {
    width: 100%;
    max-width: 480px;
    background: var(--cream);
    min-height: 100vh;
    position: relative;
  }

  section {
    padding: 64px 28px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--burgundy);
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  /* ---------- Cover (fullscreen mailbox video) ---------- */
  .cover {
    height: 100svh;
    min-height: 100svh;
    padding: 0;
    position: relative;
    border-bottom: none;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
  }

  .cover-poster,
  .cover-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cover-poster {
    z-index: 2;
    transition: opacity 0.5s ease;
  }

  .cover-poster.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .cover-video {
    z-index: 1;
  }

  .cover-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100px;
    z-index: 3;
    text-align: center;
    color: #fff;
    font-size: 21.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    animation: hintPulse 1.8s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .cover-hint.is-hidden {
    opacity: 0;
    animation: none;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50% { opacity: 0.9; transform: translateY(-4px); }
  }

  /* ---------- Image sections (full-bleed reference images) ---------- */
  .img-section {
    padding: 0;
    border-bottom: none;
  }

  .img-section img {
    display: block;
    width: 100%;
    height: auto;
  }

  .flat-photo-wrap {
    position: relative;
  }

  .flat-photo-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  .lightbox-trigger {
    position: absolute;
    cursor: zoom-in;
  }

  .img-map-buttons {
    display: flex;
    gap: 10px;
    padding: 16px 28px 28px;
  }

  .img-map-buttons a {
    flex: 1;
    display: block;
    text-align: center;
    padding: 12px 0;
    border: 1px solid #9e000e;
    color: #9e000e;
    text-decoration: none;
    font-size: 13px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .map-embed-section {
    padding: 28px 28px 0;
    border-bottom: none;
    background: var(--cream);
  }

  #kakao-map {
    width: 100%;
    height: 220px;
    border-radius: 4px;
    background: #e5dcd6;
  }

  /* ---------- Lightbox (Reels-style photo viewer) ---------- */
  .lightbox-img { cursor: zoom-in; }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: background 0.28s ease, opacity 0.28s ease;
    touch-action: none;
  }

  .lightbox-overlay.open {
    background: rgba(0,0,0,0.92);
    opacity: 1;
    visibility: visible;
  }

  .lightbox-overlay img {
    width: 100vw;
    max-width: 1080px;
    height: auto;
    display: block;
    transform: translateY(24px) scale(0.96);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox-overlay.open img {
    transform: translateY(0) scale(1);
  }

  .lightbox-overlay.closing img {
    transform: translateY(40px) scale(0.97);
    transition: transform 0.22s ease-in;
  }

  .lightbox-overlay.closing {
    background: rgba(0,0,0,0);
    opacity: 0;
  }

  .lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease;
  }

  .lightbox-overlay.open ~ .lightbox-close,
  .lightbox-close.open {
    opacity: 1;
    visibility: visible;
  }

  /* ---------- Individual Intro (정일 / 소연) ---------- */
  .intro-section {

  /* ---------- Wedding film ---------- */
  .film-section {

  }

  .film-bg-wrap {

  }

  .film-bg {

    width: 100%;
    height: auto;
  }

  .film-wrap {
    position: absolute;
    left: 28px;
    right: 28px;
    top: calc(21% + 20px);
    padding-top: 56.25%; /* 16:9 가로 영상 기준. 세로 영상이면 177.77%로 변경 */
    background: #e5dcd6;
    border-radius: 4px;
    overflow: hidden;
  }

    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Account info (마음 전하실 곳) ---------- */
  .account-section {
    padding: 0;
    background: var(--cream);
    text-align: center;

  .account-section h3 {

    letter-spacing: 2px;

  .account-wrap {

  .account-bg {

    height: auto;

  .account-content {

    left: 28px;
    right: 28px;

  }

  .account-group {
    text-align: left;
    border-top: 1px solid var(--line);
  }

  .account-group:last-child {
    border-bottom: 1px solid var(--line);
  }

  .side-toggle {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 4px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }

  .side-toggle .side-label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--ink);
  }

  .side-toggle .arrow {
    font-size: 13px;
    color: var(--ink);
    transition: transform 0.25s ease;
  }

  .side-toggle.open .arrow {
    transform: rotate(180deg);
  }

  .account-card-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;

  .account-card-wrap.open {

  .account-card {

  .account-card .info {

  .account-card .name {

    overflow: hidden;

    color: #fff;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;

  footer {
    padding: 40px 28px 60px;
    text-align: center;
    font-size: 12px;
    color: #b3a9a3;
    letter-spacing: 1px;
  }
</style>

  <img id="lightboxImg" src="" alt="">

<button class="lightbox-close" id="lightboxClose">✕</button>

<script>
/* Cover: mailbox open video, tap/swipe-up to play once */
(function () {
  var section = document.getElementById('coverSection');
  var poster = document.getElementById('coverPoster');
  var video = document.getElementById('coverVideo');
  var hint = document.getElementById('coverHint');
  var played = false;
  var touchStartY = null;

  function freezeOnLastFrame() {
    // iOS Safari can snap back to the first frame right after 'ended' fires.
    // Seeking just shy of the end and pausing keeps the last frame on screen.
    var d = video.duration;
    if (isFinite(d) && d > 0) {
      try { video.currentTime = Math.max(0, d - 0.05); } catch (err) {}
    }
    video.pause();
  }

  function goToNextSection() {
    setTimeout(function () {
      var next = document.getElementById('main-content');
      if (next) next.scrollIntoView({ behavior: 'smooth' });
    }, 500);
  }

  function playOnce() {
    if (played) return;
    played = true;
    hint.classList.add('is-hidden');
    poster.classList.add('is-hidden');
    var p = video.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () {
        // Playback blocked - reset so the next tap can retry.
        played = false;
        poster.classList.remove('is-hidden');
        hint.classList.remove('is-hidden');
      });
    }
  }

  video.addEventListener('ended', function () {
    freezeOnLastFrame();
    goToNextSection();
  });

  section.addEventListener('click', playOnce);

  section.addEventListener('touchstart', function (e) {
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  section.addEventListener('touchend', function (e) {
    if (touchStartY === null) return;
    var dy = touchStartY - e.changedTouches[0].clientY;
    touchStartY = null;
    if (dy > 30) playOnce();
  }, { passive: true });
})();

/* Lightbox */
(function () {
  var overlay = document.getElementById('lightboxOverlay');
  var overlayImg = document.getElementById('lightboxImg');
  var closeBtn = document.getElementById('lightboxClose');
  var imgs = document.querySelectorAll('.lightbox-img');

  var MIN_SCALE = 1;
  var MAX_SCALE = 3;      // pinch / double-tap zoom ceiling
  var TAP_ZOOM = 3;       // scale applied on double-tap
  var scale = 1, panX = 0, panY = 0;

  function clampPan() {
    var w = overlayImg.offsetWidth * scale;
    var h = overlayImg.offsetHeight * scale;
    var maxPanX = Math.max(0, (w - window.innerWidth) / 2);
    var maxPanY = Math.max(0, (h - window.innerHeight) / 2);
    panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
    panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
  }

  function applyTransform(withTransition) {
    if (scale === 1 && panX === 0 && panY === 0) {
      // back to the default state - let the CSS classes (open/closing) drive
      // the transform so the entrance/exit animation stays untouched.
      overlayImg.style.transition = '';
      overlayImg.style.transform = '';
      return;
    }
    overlayImg.style.transition = withTransition ? 'transform 0.25s ease' : 'none';
    overlayImg.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
  }

  function resetZoom(withTransition) {
    scale = 1; panX = 0; panY = 0;
    applyTransform(withTransition);
  }

  function openLightbox(src) {
    overlayImg.src = src;
    resetZoom(false);
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    closeBtn.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    overlay.classList.add('closing');
    overlay.classList.remove('open');
    closeBtn.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      overlay.classList.remove('closing');
      resetZoom(false);
    }, 240);
  }

  imgs.forEach(function (img) {
    img.addEventListener('click', function () {
      openLightbox(img.src);
    });
  });

  document.querySelectorAll('.lightbox-trigger').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openLightbox(el.getAttribute('data-photo'));
    });
  });

  var suppressClickUntil = 0;
  overlay.addEventListener('click', function () {
    if (Date.now() < suppressClickUntil) return;
    if (scale > 1.01) return; // tapping the backdrop while zoomed shouldn't close
    closeLightbox();
  });
  closeBtn.addEventListener('click', closeLightbox);

  /* Touch: 1-finger swipe-down to dismiss (at scale 1) or pan (when zoomed),
     2-finger pinch to zoom, double-tap to toggle zoom in/out. */
  var TAP_MOVE_THRESHOLD = 10;
  var startY = 0, startX = 0;
  var dragging = false;
  var moved = false;
  var pinching = false;
  var pinchStartDist = 1;
  var pinchStartScale = 1;
  var panStartX = 0, panStartY = 0;
  var lastTapTime = 0;

  function touchDist(t0, t1) {
    var dx = t0.clientX - t1.clientX;
    var dy = t0.clientY - t1.clientY;
    return Math.max(1, Math.sqrt(dx * dx + dy * dy));
  }

  function startDragFrom(touch) {
    dragging = true;
    moved = false;
    startX = touch.clientX;
    startY = touch.clientY;
    panStartX = panX;
    panStartY = panY;
  }

  overlay.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinching = true;
      dragging = false;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      return;
    }
    if (e.touches.length === 1) {
      pinching = false;
      var now = Date.now();
      if (now - lastTapTime < 320) {
        lastTapTime = 0;
        dragging = false;
        suppressClickUntil = now + 400;
        if (scale > 1.01) {
          resetZoom(true);
        } else {
          scale = TAP_ZOOM;
          panX = 0; panY = 0;
          applyTransform(true);
        }
      } else {
        lastTapTime = now;
        startDragFrom(e.touches[0]);
      }
    }
  }, { passive: true });

  overlay.addEventListener('touchmove', function (e) {
    if (pinching && e.touches.length === 2) {
      e.preventDefault();
      var d = touchDist(e.touches[0], e.touches[1]);
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * (d / pinchStartDist)));
      clampPan();
      applyTransform(false);
      return;
    }
    if (!dragging || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > TAP_MOVE_THRESHOLD || Math.abs(dy) > TAP_MOVE_THRESHOLD) moved = true;

    if (scale > 1.01) {
      e.preventDefault();
      panX = panStartX + dx;
      panY = panStartY + dy;
      clampPan();
      applyTransform(false);
    } else if (dy > 0) {
      e.preventDefault();
      overlayImg.style.transition = 'none';
      overlayImg.style.transform = 'translateY(' + dy + 'px) scale(' + Math.max(0.85, 1 - dy / 1000) + ')';
    }
  }, { passive: false });

  overlay.addEventListener('touchend', function (e) {
    if (pinching) {
      pinching = false;
      if (e.touches.length === 1) startDragFrom(e.touches[0]); // pinch -> pan handoff
      if (scale < 1.02) resetZoom(true);
      return;
    }
    if (!dragging) return;
    dragging = false;
    if (scale > 1.01) {
      if (moved) suppressClickUntil = Date.now() + 400;
      return; // was panning a zoomed image, nothing more to do
    }

    var dy = e.changedTouches[0].clientY - startY;
    applyTransform(true);
    if (moved && dy > 80) {
      closeLightbox();
    }
  }, { passive: false });
})();

/* Account toggle (개별) */
document.querySelectorAll('.side-toggle').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = document.getElementById(btn.getAttribute('data-target'));
    var open = target.classList.toggle('open');
    btn.classList.toggle('open', open);
  });
});

/* Copy buttons */
document.querySelectorAll('.copy-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var text = btn.getAttribute('data-copy');
    navigator.clipboard.writeText(text).then(function () {
      var original = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = original; }, 1500);
    });
  });
});
</script>
