<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>윤정일 ♥ 성소연 결혼합니다</title>

<meta property="og:title" content="윤정일 ♥ 성소연 결혼합니다">
<meta property="og:description" content="2026년 10월 10일 토요일 오후 1시 · 레이어스튜디오11">
<meta property="og:image" content="https://season-of.github.io/JUNGIL-SOYEON/images/thumbnail.jpg">
<meta property="og:url" content="https://season-of.github.io/JUNGIL-SOYEON/">
<meta property="og:type" content="website">

<style>
  :root {
    --burgundy: #1a1a1a;
    --burgundy-light: #333333;
    --cream: #fffef8;
    --ink: #1a1a1a;
    --line: #e0ddd0;
    --pink-bg: #f5f4ec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #fffef8;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  .invite {
    width: 100%;
    max-width: 480px;
    background: var(--cream);
    min-height: 100vh;
    position: relative;
  }

  section {
    padding: 64px 28px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--burgundy);
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  /* ---------- Cover (fullscreen photo) ---------- */
  .cover {
    height: 100svh;
    min-height: 100svh;
    padding: 0;
    position: relative;
    border-bottom: none;
    background: #1a1a1a url('images/cover.jpg') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
  }

  .cover-scroll {
    position: relative;
    z-index: 2;
    padding-bottom: 40px;
    text-align: center;
  }

  .view-details {
    margin: 0 auto;
    background: none;
    border: none;
    font-size: 12px;
    letter-spacing: 2px;
    color: white;
    cursor: pointer;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }

  .view-details .chevron {
    font-size: 14px;
    animation: bounce 1.6s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  /* ---------- Image sections (full-bleed reference images) ---------- */
  .img-section {
    padding: 0;
    border-bottom: none;
  }

  .img-section img {
    display: block;
    width: 100%;
    height: auto;
  }

  .img-map-buttons {
    display: flex;
    gap: 10px;
    padding: 16px 28px 28px;
  }

  .img-map-buttons a {
    flex: 1;
    display: block;
    text-align: center;
    padding: 12px 0;
    border: 1px solid var(--burgundy);
    color: var(--burgundy);
    text-decoration: none;
    font-size: 13px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .map-embed-section {
    padding: 28px 28px 0;
    border-bottom: none;
    background: var(--cream);
  }

  #kakao-map {
    width: 100%;
    height: 220px;
    border-radius: 4px;
    background: #e5dcd6;
  }

  /* ---------- Lightbox (Reels-style photo viewer) ---------- */
  .lightbox-img { cursor: zoom-in; }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: background 0.28s ease, opacity 0.28s ease;
    touch-action: none;
  }

  .lightbox-overlay.open {
    background: rgba(0,0,0,0.92);
    opacity: 1;
    visibility: visible;
  }

  .lightbox-overlay img {
    width: 100vw;
    max-width: 1080px;
    height: auto;
    display: block;
    transform: translateY(24px) scale(0.96);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox-overlay.open img {
    transform: translateY(0) scale(1);
  }

  .lightbox-overlay.closing img {
    transform: translateY(40px) scale(0.97);
    transition: transform 0.22s ease-in;
  }

  .lightbox-overlay.closing {
    background: rgba(0,0,0,0);
    opacity: 0;
  }

  .lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease;
  }

  .lightbox-overlay.open ~ .lightbox-close,
  .lightbox-close.open {
    opacity: 1;
    visibility: visible;
  }

  /* ---------- Wedding film ---------- */
  .film-section {
    padding: 40px 28px;
    background: var(--cream);
  }

  .film-section h3 {
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 18px;
    color: var(--ink);
  }

  .film-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 가로 영상 기준. 세로 영상이면 177.77%로 변경 */
    background: #e5dcd6;
    border-radius: 4px;
    overflow: hidden;
  }

  .film-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Account info (마음 전하실 곳) ---------- */
  .account-section {
    padding: 40px 28px 20px;
    background: var(--cream);
    text-align: center;
  }

  .account-section h3 {
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: var(--ink);
  }

  .account-toggle {
    margin-top: 14px;
    padding: 12px 24px;
    border: 1px solid var(--burgundy);
    color: var(--burgundy);
    background: none;
    font-size: 13px;
    letter-spacing: 0.5px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }

  .account-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .account-list.open {
    max-height: 600px;
  }

  .account-group {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: left;
  }

  .account-group .side-label {
    font-size: 12px;
    letter-spacing: 1px;
    color: #999;
    margin-bottom: 10px;
  }

  .account-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }

  .account-row .who {
    font-size: 13px;
    color: var(--ink);
  }

  .account-row .num {
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0.3px;
  }

  .account-row button {
    margin-left: 10px;
    padding: 5px 10px;
    font-size: 11px;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
  }

  footer {
    padding: 40px 28px 60px;
    text-align: center;
    font-size: 12px;
    color: #b3a9a3;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="invite">

  <!-- Cover: fullscreen photo -->
  <div class="cover">
    <div class="cover-scroll">
      <button class="view-details" id="viewDetailsBtn">
        View Details
        <span class="chevron">⌄</span>
      </button>
    </div>
  </div>

  <!-- Invitation (image, top part) -->
  <section class="img-section" id="main-content">
    <img src="images/invite-top.jpg" alt="초대의 말씀">
  </section>

  <!-- Real Kakao Map -->
  <section class="map-embed-section">
    <div id="kakao-map"></div>
    <div class="map-buttons img-map-buttons">
      <a href="https://map.kakao.com/link/search/레이어스튜디오11" target="_blank">카카오맵으로 길찾기</a>
      <a href="https://map.naver.com/p/search/레이어스튜디오11" target="_blank">네이버지도로 길찾기</a>
    </div>
  </section>

  <!-- Parking + Subway (image, bottom part) -->
  <section class="img-section">
    <img src="images/invite-bottom.jpg" alt="주차 안내, 지하철 안내">
  </section>

  <!-- Wedding Film -->
  <section class="film-section">
    <h3>Wedding Film</h3>
    <div class="film-wrap">
      <iframe src="https://www.youtube.com/embed/MW7IBp1zAWA" title="Wedding Film" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </section>

  <!-- Gallery (image) -->
  <section class="img-section">
    <img class="lightbox-img" src="images/gallery.jpg" alt="갤러리">
  </section>

  <!-- Account info -->
  <section class="account-section">
    <h3>마음 전하실 곳</h3>
    <button class="account-toggle" id="accountToggle">계좌번호 보기</button>
    <div class="account-list" id="accountList">
      <div class="account-group">
        <div class="side-label">신랑측</div>
        <div class="account-row">
          <span class="who">윤정일 (국민은행)</span>
          <span class="num">653202-04-153823</span>
          <button class="copy-btn" data-copy="653202-04-153823">복사</button>
        </div>
      </div>
      <div class="account-group">
        <div class="side-label">신부측</div>
        <div class="account-row">
          <span class="who">성소연 (국민은행)</span>
          <span class="num">762902-01-300351</span>
          <button class="copy-btn" data-copy="762902-01-300351">복사</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    윤정일 &amp; 성소연의 결혼식에<br>초대합니다
  </footer>

</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" src="" alt="">
</div>
<button class="lightbox-close" id="lightboxClose">✕</button>

<script>
document.getElementById('viewDetailsBtn').addEventListener('click', function() {
  document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
});

/* Lightbox */
(function () {
  var overlay = document.getElementById('lightboxOverlay');
  var overlayImg = document.getElementById('lightboxImg');
  var closeBtn = document.getElementById('lightboxClose');
  var imgs = document.querySelectorAll('.lightbox-img');

  function openLightbox(src) {
    overlayImg.src = src;
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    closeBtn.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    overlay.classList.add('closing');
    overlay.classList.remove('open');
    closeBtn.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      overlay.classList.remove('closing');
    }, 240);
  }

  imgs.forEach(function (img) {
    img.addEventListener('click', function () {
      openLightbox(img.src);
    });
  });

  overlay.addEventListener('click', closeLightbox);
  closeBtn.addEventListener('click', closeLightbox);

  /* swipe down to dismiss */
  var startY = 0;
  overlay.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  });
  overlay.addEventListener('touchmove', function (e) {
    var dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      overlayImg.style.transform = 'translateY(' + dy + 'px) scale(' + Math.max(0.85, 1 - dy / 1000) + ')';
    }
  });
  overlay.addEventListener('touchend', function (e) {
    var dy = e.changedTouches[0].clientY - startY;
    overlayImg.style.transform = '';
    if (dy > 80) {
      closeLightbox();
    }
  });
})();

/* Account toggle */
document.getElementById('accountToggle').addEventListener('click', function () {
  var list = document.getElementById('accountList');
  var open = list.classList.toggle('open');
  this.textContent = open ? '계좌번호 닫기' : '계좌번호 보기';
});

/* Copy buttons */
document.querySelectorAll('.copy-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var text = btn.getAttribute('data-copy');
    navigator.clipboard.writeText(text).then(function () {
      var original = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = original; }, 1500);
    });
  });
});
</script>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1d4f9fb7d036666893afad1b329cd254&libraries=services&autoload=false"></script>
<script>
kakao.maps.load(function () {
  var geocoder = new kakao.maps.services.Geocoder();
  var address = '서울시 마포구 신수동 93-4';

  geocoder.addressSearch(address, function (result, status) {
    var mapContainer = document.getElementById('kakao-map');
    var mapOption = {
      center: new kakao.maps.LatLng(37.5495, 126.9425),
      level: 3
    };

    if (status === kakao.maps.services.Status.OK && result[0]) {
      var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
      mapOption.center = coords;

      var map = new kakao.maps.Map(mapContainer, mapOption);
      var marker = new kakao.maps.Marker({ map: map, position: coords });

      var infowindow = new kakao.maps.InfoWindow({
        content: '<div style="padding:6px 10px;font-size:12px;">레이어스튜디오11</div>'
      });
      infowindow.open(map, marker);
    } else {
      new kakao.maps.Map(mapContainer, mapOption);
    }
  });
});
</script>

</body>
