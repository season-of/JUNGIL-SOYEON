    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;

  .cover-scroll {
    position: relative;
    z-index: 2;
    padding-bottom: 40px;
    text-align: center;
  }

  .view-details {
    margin: 0 auto;
    background: none;
    border: none;
    font-size: 12px;
    letter-spacing: 2px;
    color: white;
    cursor: pointer;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }

  .view-details .chevron {
    font-size: 14px;
    animation: bounce 1.6s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  /* ---------- Image sections (full-bleed reference images) ---------- */
  .img-section {
    padding: 0;
    border-bottom: none;
  }

  .img-section img {
    display: block;
    width: 100%;
    height: auto;
  }

  .flat-photo-wrap {
    position: relative;
  }

  .flat-photo-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  .lightbox-trigger {

  }

  .img-map-buttons {

    padding: 16px 28px 28px;

    color: var(--burgundy);

  .map-embed-section {

  #kakao-map {

    height: 220px;
    border-radius: 4px;

  /* ---------- Lightbox (Reels-style photo viewer) ---------- */
  .lightbox-img { cursor: zoom-in; }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: background 0.28s ease, opacity 0.28s ease;
    touch-action: none;
  }

  .lightbox-overlay.open {
    background: rgba(0,0,0,0.92);
    opacity: 1;
    visibility: visible;
  }

  .lightbox-overlay img {
    width: 100vw;
    max-width: 1080px;
    height: auto;
    display: block;
    transform: translateY(24px) scale(0.96);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox-overlay.open img {
    transform: translateY(0) scale(1);
  }

  .lightbox-overlay.closing img {

    transition: transform 0.22s ease-in;
  }

  .lightbox-overlay.closing {
    background: rgba(0,0,0,0);
    opacity: 0;
  }

  .lightbox-close {

    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.15);

    font-size: 18px;
    line-height: 1;
    z-index: 1000;

    visibility: hidden;

  }

  .lightbox-overlay.open ~ .lightbox-close,

</style>

<script>
document.getElementById('viewDetailsBtn').addEventListener('click', function() {
  document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
});

/* Lightbox */
(function () {
  var overlay = document.getElementById('lightboxOverlay');
  var overlayImg = document.getElementById('lightboxImg');
  var closeBtn = document.getElementById('lightboxClose');
  var imgs = document.querySelectorAll('.lightbox-img');

  function openLightbox(src) {
    overlayImg.src = src;
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    closeBtn.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    overlay.classList.add('closing');
    overlay.classList.remove('open');
    closeBtn.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      overlay.classList.remove('closing');
    }, 240);
  }

  imgs.forEach(function (img) {
    img.addEventListener('click', function () {
      openLightbox(img.src);
    });
  });

  document.querySelectorAll('.lightbox-trigger').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openLightbox(el.getAttribute('data-photo'));
    });
  });

  overlay.addEventListener('click', closeLightbox);
  closeBtn.addEventListener('click', closeLightbox);

  /* swipe down to dismiss */
  var startY = 0;
  overlay.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  });
  overlay.addEventListener('touchmove', function (e) {
    var dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      overlayImg.style.transform = 'translateY(' + dy + 'px) scale(' + Math.max(0.85, 1 - dy / 1000) + ')';
    }
  });
  overlay.addEventListener('touchend', function (e) {
    var dy = e.changedTouches[0].clientY - startY;
    overlayImg.style.transform = '';
    if (dy > 80) {
      closeLightbox();
    }
  });
})();

/* Account toggle (개별) */
document.querySelectorAll('.side-toggle').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = document.getElementById(btn.getAttribute('data-target'));
    var open = target.classList.toggle('open');
    btn.classList.toggle('open', open);
  });
});

/* Copy buttons */
document.querySelectorAll('.copy-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var text = btn.getAttribute('data-copy');
    navigator.clipboard.writeText(text).then(function () {
      var original = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = original; }, 1500);
    });
  });
});
</script>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1d4f9fb7d036666893afad1b329cd254&libraries=services&autoload=false"></script>
<script>
kakao.maps.load(function () {
  var geocoder = new kakao.maps.services.Geocoder();
  var address = '서울시 마포구 신수동 93-4';

  geocoder.addressSearch(address, function (result, status) {
    var mapContainer = document.getElementById('kakao-map');
    var mapOption = {
      center: new kakao.maps.LatLng(37.5495, 126.9425),
      level: 3
    };

    if (status === kakao.maps.services.Status.OK && result[0]) {
      var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
      mapOption.center = coords;

      var map = new kakao.maps.Map(mapContainer, mapOption);
      var marker = new kakao.maps.Marker({ map: map, position: coords });

      var infowindow = new kakao.maps.InfoWindow({
        content: '<div style="padding:6px 10px;font-size:12px;">레이어스튜디오11</div>'
      });
      infowindow.open(map, marker);
    } else {
      new kakao.maps.Map(mapContainer, mapOption);
    }
  });
});
</script>
